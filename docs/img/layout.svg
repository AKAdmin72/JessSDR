<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="holes" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2f7d3a"/><circle cx="6" cy="6" r="2.2" fill="#c9a24a"/>
    </pattern>
    <style>
      .t{fill:#fff;text-anchor:middle}
      .d{fill:#111;text-anchor:middle}
      .s{fill:#ddd;text-anchor:middle;font-size:11px}
      .g{fill:#444;font-size:11px}
      .w{stroke:#d33;stroke-width:2;fill:none}
      .w2{stroke:#36c;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="900" height="620" fill="#f4f1ea"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111">JessSDR: general view (2026-11-22)</text>

  <!-- display -->
  <rect x="120" y="50" width="380" height="250" rx="6" fill="#c8302c"/>
  <rect x="140" y="64" width="340" height="222" fill="#0b1020"/>
  <text x="310" y="84" fill="#7fd" font-size="13" text-anchor="middle">7.100.000  LSB 2.4k   S7</text>
  <polyline points="150,200 170,196 190,198 210,190 230,195 250,170 262,140 270,175 290,192 310,188 330,160 340,150 350,165 370,194 390,190 410,196 430,185 450,193 470,197" stroke="#ff0" fill="none" stroke-width="1.5"/>
  <line x1="310" y1="100" x2="310" y2="206" stroke="#f33" stroke-dasharray="4 3"/>
  <rect x="150" y="210" width="320" height="66" fill="url(#wf)"/>
  <linearGradient id="wf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1a2a8a"/><stop offset="1" stop-color="#050a30"/></linearGradient>
  <line x1="262" y1="210" x2="262" y2="276" stroke="#fd3" stroke-width="2"/>
  <line x1="340" y1="210" x2="340" y2="276" stroke="#f83" stroke-width="3"/>
  <text x="310" y="316" class="d">4" ST7796S 480×320 (ESP32 J1: CS/RST/DC/MOSI/SCK/LED = 4/5/6/7/15/16)</text>

  <!-- perfboard -->
  <rect x="60" y="330" width="760" height="270" rx="6" fill="url(#holes)" stroke="#1d5a26" stroke-width="2"/>

  <!-- ESP -->
  <rect x="100" y="350" width="150" height="230" rx="4" fill="#151515"/>
  <rect x="130" y="370" width="90" height="70" fill="#9aa"/>
  <text x="175" y="410" class="d" font-size="11">ESP32-S3</text>
  <text x="175" y="470" class="t">ESP32-S3</text>
  <text x="175" y="488" class="s">DevKitC N16R8</text>
  <text x="175" y="506" class="s">UI, FFT, menu</text>
  <rect x="120" y="560" width="30" height="20" fill="#bbb"/><rect x="200" y="560" width="30" height="20" fill="#bbb"/>
  <text x="175" y="574" class="s">USB</text>

  <!-- Tang -->
  <rect x="300" y="350" width="140" height="230" rx="4" fill="#111"/>
  <rect x="340" y="356" width="60" height="30" fill="#bbb"/><text x="370" y="375" class="d" font-size="10">HDMI</text>
  <rect x="330" y="450" width="80" height="60" fill="#333"/>
  <text x="370" y="420" class="t">Tang Nano 20K</text>
  <text x="370" y="438" class="s">GW2AR-18</text>
  <text x="370" y="485" class="s">DSP, audio</text>
  <rect x="355" y="560" width="30" height="20" fill="#bbb"/>
  <circle cx="315" cy="565" r="7" fill="#ddd"/><circle cx="425" cy="565" r="7" fill="#ddd"/>
  <text x="315" y="552" class="s">S2</text><text x="425" y="552" class="s">S1</text>

  <!-- link wires -->
  <path class="w" d="M250,380 H300"/><path class="w" d="M250,392 H300"/><path class="w" d="M250,404 H300"/>
  <path class="w2" d="M250,500 H300"/><path class="w2" d="M250,512 H300"/><path class="w2" d="M250,524 H300"/>
  <text x="275" y="372" class="s" fill="#fdd">SPI</text><text x="275" y="540" class="s">I2S</text>

  <!-- ADC -->
  <rect x="500" y="380" width="200" height="150" rx="4" fill="#111"/>
  <text x="600" y="420" class="t">AD9226</text>
  <text x="600" y="438" class="s">12 bit 64.8 MSPS</text>
  <text x="600" y="456" class="s">AD8138 mod +25 dB</text>
  <rect x="700" y="440" width="34" height="24" fill="#d9b44a"/><text x="717" y="480" class="d" font-size="11">SMA</text>
  <path stroke="#888" stroke-width="3" fill="none" d="M440,420 H500"/><path stroke="#888" stroke-width="3" fill="none" d="M440,440 H500"/><path stroke="#888" stroke-width="3" fill="none" d="M440,460 H500"/>
  <text x="470" y="412" class="s">D0..D11</text>

  <!-- antenna -->
  <path stroke="#333" stroke-width="2" fill="none" d="M734,452 H790 V250"/>
  <rect x="760" y="200" width="70" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="795" y="222" class="d" font-size="12">BPF</text><text x="795" y="238" class="d" font-size="11">40 m</text>
  <path stroke="#333" stroke-width="2" fill="none" d="M795,200 V110"/>
  <path stroke="#333" stroke-width="2" fill="none" d="M775,90 L795,110 L815,90 M795,110 V70"/>
  <text x="840" y="90" class="g">ANT</text>

  <!-- encoder & speaker -->
  <circle cx="610" cy="150" r="42" fill="#333"/><circle cx="610" cy="150" r="18" fill="#777"/>
  <text x="610" y="215" class="d" font-size="12">Encoder</text>
  <text x="610" y="231" class="g" text-anchor="middle">LPD3806-600BM → ESP 17/18</text>
  <path stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5 4" d="M568,150 H520 V323 H40 V470 H100"/>
  <circle cx="860" cy="560" r="24" fill="#555" stroke="#222" stroke-width="3"/><circle cx="860" cy="560" r="9" fill="#999"/>
  <text x="860" y="530" class="g" text-anchor="middle">Speaker</text>
  <path stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5 4" d="M440,570 H836"/>
  <text x="520" y="556" style="fill:#eee;font-size:11px">MAX98357A (on Tang)</text>
</svg>
